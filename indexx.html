<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Seru</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .card:hover { transform: translateY(-8px); }
        .card .emoji { font-size: 3.5rem; display: block; margin-bottom: 10px; }
        .game-screen {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
        }
        .game-screen.active { display: block; }
        .score-bar {
            display: flex;
            justify-content: space-between;
            background: #f5f5f5;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .question-box {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-size: 1.05rem;
            transition: 0.2s;
        }
        .option:hover { background: #e3f2fd; border-color: #2196F3; }
        .option.correct { background: #4CAF50; color: white; border-color: #4CAF50; }
        .option.wrong { background: #f44336; color: white; border-color: #f44336; }
        .feedback {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            margin: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .result { text-align: center; padding: 30px 10px; }
        .stars { font-size: 2.5rem; margin: 15px 0; }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 15px 0;
        }
        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            cursor: pointer;
            color: white;
        }
        .memory-card.flipped { background: white; color: #333; }
        .memory-card.matched { background: #4CAF50; cursor: default; }
        @media (max-width: 600px) {
            .options, .memory-grid { grid-template-columns: 1fr 1fr; }
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Belajar Seru!</h1>
            <p>Main sambil belajar</p>
        </header>

        <div id="menu" class="menu">
            <div class="card" onclick="startGame('math')">
                <span class="emoji">➕</span>
                <h2>Matematika</h2>
            </div>
            <div class="card" onclick="startGame('english')">
                <span class="emoji">🔤</span>
                <h2>Bahasa Inggris</h2>
            </div>
            <div class="card" onclick="startGame('science')">
                <span class="emoji">🔬</span>
                <h2>Sains</h2>
            </div>
            <div class="card" onclick="startMemory()">
                <span class="emoji">🧠</span>
                <h2>Memory</h2>
            </div>
        </div>

        <div id="quiz-screen" class="game-screen">
            <div class="score-bar">
                <div>Skor: <span id="score">0</span></div>
                <div id="hearts">❤️❤️❤️</div>
                <div>Soal <span id="current">1</span>/10</div>
            </div>
            <div class="question-box" id="question"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
            <div style="text-align:center;">
                <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">Soal Berikutnya</button>
                <button class="btn" onclick="showMenu()">Menu</button>
            </div>
        </div>

        <div id="memory-screen" class="game-screen">
            <div class="score-bar">
                <div>Pasangan: <span id="pairs">0</span>/6</div>
                <div>Percobaan: <span id="moves">0</span></div>
            </div>
            <div class="memory-grid" id="memory-grid"></div>
            <div style="text-align:center;">
                <button class="btn" onclick="startMemory()">Ulang</button>
                <button class="btn" onclick="showMenu()">Menu</button>
            </div>
        </div>

        <div id="result-screen" class="game-screen">
            <div class="result">
                <h2 id="result-title">Selesai!</h2>
                <div class="stars" id="stars">⭐⭐⭐</div>
                <p id="result-text"></p>
                <button class="btn" onclick="showMenu()">Main Lagi</button>
            </div>
        </div>
    </div>
